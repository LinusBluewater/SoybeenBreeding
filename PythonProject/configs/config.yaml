project:
  name: SoybeanBreeding
  seed: 42

paths:
  geno: data/geno_clean.csv
  pheno: data/pheno_clean.csv
  geno_raw: data/geno.csv
  pheno_raw: data/pheno.csv

  gwas_out: outputs/gwas
  model_out: outputs/models
  plot_out: outputs/plots
  figure_out: outputs/figures
  blup_out: outputs/blup
  preprocessor_out: outputs/preprocessors

task:
  target: yield
  drop_cols: ["X", "year", "family"]
  # 方案A：环境作为协变量时，从原始pheno中保留的性状列
  trait_cols: ["height", "R8", "planting", "flower", "maturity", "lodging", "yield", "protein", "oil", "size"]
  # 需要 one-hot 编码的环境列
  env_col: "environ"

# 方案A 专用配置
env_model:
  # 是否按品种分组拆分（防止数据泄露）
  group_split: true

# 方案2：BLUP 育种值提取配置
blup:
  enabled: true
  env_col: "environ"        # 固定效应列（环境）
  group_col: "strain"      # 随机效应列（品种）
  method: "bfgs"            # 优化器：bfgs / lbfgs / powell
  maxiter: 1000             # 最大迭代次数
  min_envs_per_strain: 2    # 品种最少环境数（少于则剔除，否则 BLUP 不稳定）
  out_dir: outputs/blup

data:
  test_size: 0.2
  val_size: 0.2
  random_state: 42

preprocess:
  imputer: most_frequent
  scaler: standard

model:
  cnn:
    filters: [32, 64, 128]
    kernels: [5, 5, 3]
    dropout: 0.3
    dense: 64

train:
  batch_size: 32
  epochs: 100

early_stop:
  patience: 10
  monitor: val_loss
  restore_best_weights: true